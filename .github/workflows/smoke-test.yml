name: Smoke test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      # The package installs the language server with Pkg when it starts. Install and precompile it in the shared
      # depot first, so that this doesn't count against the smoke test's timeout.
      - name: Precompile language server
        shell: bash
        run: |
          cp -r server "$RUNNER_TEMP/julia-server"
          julia --startup-file=no --project="$RUNNER_TEMP/julia-server" --eval 'import Pkg; Pkg.instantiate(); Pkg.precompile()'

      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          # Provides the Julia syntax, which Sublime Text doesn't include.
          extra-packages: JuliaEditorSupport/Julia-sublime@v
