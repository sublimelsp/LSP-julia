name: Smoke test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Lets an organization variable choose the LSP ref to test against, see
      # https://github.com/sublimelsp/lsp_smoke_test#testing-against-an-lsp-branch
      LSP_SMOKE_TEST_LSP_REF: ${{ vars.LSP_SMOKE_TEST_LSP_REF }}
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'

      # The package installs the language server with Pkg when it starts. Install it in the shared depot first, which
      # also precompiles it, so that this doesn't count against the smoke test's timeout.
      - name: Precompile language server
        shell: bash
        run: |
          cp -r server "$RUNNER_TEMP/julia-server"
          julia --startup-file=no --project="$RUNNER_TEMP/julia-server" --eval 'import Pkg; Pkg.instantiate()'

      - uses: sublimelsp/lsp_smoke_test@v1
        with:
          # Provides the Julia syntax, which Sublime Text doesn't include.
          extra-packages: JuliaEditorSupport/Julia-sublime@v
